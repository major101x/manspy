<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ManSpy avatar">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1416"/>
      <stop offset="1" stop-color="#06292B"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0E3438"/>
      <stop offset="1" stop-color="#06292B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="airis" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0A2A2E"/>
      <stop offset="1" stop-color="#041517"/>
    </radialGradient>
    <linearGradient id="asweep" x1="256" y1="256" x2="396" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37E6C0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#37E6C0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="alens">
      <path d="M64 256 C 128 168, 384 168, 448 256 C 384 344, 128 344, 64 256 Z"/>
    </clipPath>
  </defs>

  <!-- full-bleed background (safe under circular crop) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#abg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#aglow)"/>

  <!-- eye / lens -->
  <path d="M64 256 C 128 168, 384 168, 448 256 C 384 344, 128 344, 64 256 Z" fill="url(#airis)" stroke="#37E6C0" stroke-width="5"/>

  <!-- radar scope -->
  <g clip-path="url(#alens)">
    <circle cx="256" cy="256" r="36" fill="none" stroke="#1C5B5E" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="68" fill="none" stroke="#1C5B5E" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="100" fill="none" stroke="#164B4E" stroke-width="2.5"/>
    <line x1="64" y1="256" x2="448" y2="256" stroke="#164B4E" stroke-width="2.5"/>
    <line x1="256" y1="168" x2="256" y2="344" stroke="#164B4E" stroke-width="2.5"/>
    <path d="M256 256 L 396 160 A 170 170 0 0 0 296 128 Z" fill="url(#asweep)"/>
    <circle cx="332" cy="206" r="8" fill="#37E6C0"/>
    <circle cx="190" cy="296" r="5.5" fill="#37E6C0" fill-opacity="0.65"/>
    <circle cx="288" cy="292" r="4.5" fill="#37E6C0" fill-opacity="0.5"/>
  </g>

  <!-- pupil -->
  <circle cx="256" cy="256" r="24" fill="#0B1416" stroke="#37E6C0" stroke-width="5"/>
  <circle cx="256" cy="256" r="7.5" fill="#37E6C0"/>
</svg>
